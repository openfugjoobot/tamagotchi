server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Security-Header ----
    # Nicht bei Suchmaschinen indexieren (gilt auch fuer Nicht-HTML-Dateien).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # style-src braucht accounts.google.com und 'unsafe-inline': GIS setzt fuer den
    # Button eigene Styles. script-src bleibt strikt.
    # img-src erlaubt Google-Avatare (Profilbild im Konto-Popover).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    # Service Worker nie cachen
    location = /sw.js {
        add_header Cache-Control "no-store" always;
    }

    # Precache-Liste und Build-Version (Build-Artefakte) nie cachen
    location = /precache.json {
        add_header Cache-Control "no-store" always;
    }
    location = /version.json {
        add_header Cache-Control "no-store" always;
    }

    # Manifest kurz cachen: Aenderungen sollen schnell ankommen.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Gehashte Build-Artefakte sind unveraenderlich -> lange cachen.
    location ~ "^/assets/" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Emulator-Kern und ROMs aendern sich nie.
    location ~* "^/emu/.*\.(wasm|bin)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

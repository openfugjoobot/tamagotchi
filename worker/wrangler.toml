name = "tamagotchi-saves"
main = "../src/worker/index.ts"
compatibility_date = "2025-09-01"

# Same-origin unter der bestehenden Domain (kein CORS nötig).
# Achtung: muss VOR [[kv_namespaces]] stehen, sonst landet es im KV-Block.
routes = [
  { pattern = "tamagotchi.fugjoo.com/api/*", zone_name = "fugjoo.com" }
]

# Google-OAuth-Client-ID (öffentlich) – hier eintragen, sobald der Client existiert.
[vars]
GOOGLE_CLIENT_ID = "779641556442-4oltvqom0m54n1fqh5fq4tpk3uchcl5p.apps.googleusercontent.com"

# KV-Namespace für die Spielstände: `npx wrangler kv namespace create SAVES`
# und die ausgegebene ID hier eintragen.
[[kv_namespaces]]
binding = "SAVES"
id = "61ddc27cc892461b93f1529f2e9e2de5"

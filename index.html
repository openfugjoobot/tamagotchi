<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tamagotchi P1 — Play the original 1996 firmware in your browser</title>
  <meta name="description" content="Play the original Tamagotchi P1 (1996) firmware right in your browser. Feed, play with and raise your virtual pet — your progress is saved automatically. Free, no account, works offline." />
  <meta name="theme-color" content="#0a1a2e" />
  <meta name="color-scheme" content="light dark" />
  <link rel="canonical" href="https://tamagotchi.fugjoo.com/" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tamagotchi P1" />
  <meta property="og:title" content="Tamagotchi P1 — the original firmware, in your browser" />
  <meta property="og:description" content="Play the original 1996 Tamagotchi P1 firmware in your browser. Feed, play and raise your pet. Progress saves automatically." />
  <meta property="og:url" content="https://tamagotchi.fugjoo.com/" />
  <meta property="og:image" content="https://tamagotchi.fugjoo.com/icons/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tamagotchi P1 — the original firmware, in your browser" />
  <meta name="twitter:description" content="Play the original 1996 Tamagotchi P1 firmware in your browser." />
  <meta name="twitter:image" content="https://tamagotchi.fugjoo.com/icons/og.png" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/src/ui/device.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tamagotchi P1",
    "url": "https://tamagotchi.fugjoo.com/",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web",
    "browserRequirements": "Requires JavaScript and WebAssembly",
    "description": "Play the original Tamagotchi P1 (1996) firmware in your browser. Feed, play and raise your virtual pet; progress saves automatically.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
  }
  </script>
</head>
<body data-bg="day">
  <script src="/theme-init.js"></script>
  <a class="skip" href="#device">Skip to the game</a>
  <div class="bg-anim" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="#top">Tamagotchi<span>P1</span></a>
      <div class="header-actions">
        <a class="icon-link" href="/guide.html" data-i18n-aria="guide" data-i18n-title="guide">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.7" />
            <circle cx="12" cy="8.15" r="1.3" fill="currentColor" />
            <rect x="11.1" y="10.8" width="1.8" height="6.4" rx="0.9" fill="currentColor" />
          </svg>
        </a>
        <button class="hamburger" id="btn-menu" aria-label="Menu" aria-expanded="false" aria-controls="menu" aria-haspopup="dialog">☰</button>
      </div>
    </div>
  </header>

  <main id="top">
    <h1 class="sr-only">Tamagotchi P1 — play the original 1996 firmware in your browser</h1>
    <section class="hero">
      <div class="device-wrap" data-shell="teal">
      <div class="hanger" aria-hidden="true"><span class="chain"></span><span class="ring"></span></div>
      <div id="device" class="device shell-teal">
        <div class="screen-wrap">
          <svg class="star" viewBox="0 0 100 100" aria-hidden="true" preserveAspectRatio="none">
            <defs>
              <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffe45c" />
                <stop offset="0.5" stop-color="#ffd21e" />
                <stop offset="1" stop-color="#f0b400" />
              </linearGradient>
            </defs>
            <polygon points="50.0,0.0 57.1,9.6 67.1,3.0 70.5,14.5 82.1,11.7 81.4,23.6 93.3,25.0 88.5,36.0 99.2,41.3 91.0,50.0 99.2,58.7 88.5,64.0 93.3,75.0 81.4,76.4 82.1,88.3 70.5,85.5 67.1,97.0 57.1,90.4 50.0,100.0 42.9,90.4 32.9,97.0 29.5,85.5 17.9,88.3 18.6,76.4 6.7,75.0 11.5,64.0 0.8,58.7 9.0,50.0 0.8,41.3 11.5,36.0 6.7,25.0 18.6,23.6 17.9,11.7 29.5,14.5 32.9,3.0 42.9,9.6" fill="url(#sun)" />
          </svg>
          <div class="screen-stack">
            <canvas class="icons" id="icons-top" width="32" height="8" aria-hidden="true"></canvas>
            <div class="screen-well">
              <canvas id="lcd" class="lcd" width="32" height="16" role="img" aria-label="Tamagotchi LCD screen"></canvas>
            </div>
            <canvas class="icons" id="icons-bottom" width="32" height="8" aria-hidden="true"></canvas>
          </div>
        </div>
        <div id="controls" class="controls">
          <div class="ctrl"><button id="btn-a" aria-label="Select"></button><span>SELECT</span></div>
          <div class="ctrl"><button id="btn-b" aria-label="Confirm"></button><span>CONFIRM</span></div>
          <div class="ctrl"><button id="btn-c" aria-label="Next"></button><span>NEXT</span></div>
        </div>
      </div>
      <div class="device-shadow" aria-hidden="true"></div>
      </div>
      <div class="grass" id="grass" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span><span data-i18n="footerFirmware">firmware via</span> <a href="https://github.com/jcrona/tamalib" target="_blank" rel="noopener">TamaLIB</a></span>
      <span class="footer-dot">·</span>
      <a href="https://github.com/openfugjoobot/tamagotchi" target="_blank" rel="noopener" data-i18n="footerSource">source</a>
      <span class="footer-dot">·</span>
      <a href="https://fugjoo.com" target="_blank" rel="noopener">fugjoo.com</a>
    </div>
  </footer>

  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="card">
      <h2 id="modal-title" data-i18n="modalTitle">Restart?</h2>
      <p class="hint" data-i18n="modalBody">Your current progress will be discarded and a new egg begins.</p>
      <div class="row">
        <button id="btn-cancel" data-i18n="cancel">Cancel</button>
        <button id="btn-confirm-reset" data-i18n="restartBtn">Restart</button>
      </div>
    </div>
  </div>

  <div id="loading" role="status" aria-live="polite"><div class="spin"></div><div class="loadtxt" data-i18n="loading">loading …</div><div id="loadbar" hidden><i id="loadbar-fill"></i></div></div>

  <div class="menu" id="menu" hidden role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="menu-head"><b id="menu-title" data-i18n="menu">Menu</b><button class="menu-x" id="menu-close" aria-label="Close">✕</button></div>
    <div class="shell-stage" id="shell-stage"></div>
    <div class="menu-sec">
      <span class="menu-label" data-i18n="shell">Shell</span>
      <div class="shellbtns" id="shellbtns"></div>
    </div>
    <div class="menu-sec">
      <span class="menu-label" data-i18n="background">Background</span>
      <div class="bgbtns" id="bgbtns"></div>
    </div>
    <div class="menu-divider"></div>
    <nav class="menu-list">
      <button class="menu-row" id="btn-sound" aria-pressed="true">
        <span class="menu-row-main">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 10v4h3l4 3V7l-4 3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M15.4 9.6a3.4 3.4 0 0 1 0 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M18 7.2a7 7 0 0 1 0 9.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span data-i18n="sound">Sound</span>
        </span>
        <span class="chev" id="sound-state">on</span>
      </button>
      <button class="menu-row" id="btn-notify" aria-pressed="false">
        <span class="menu-row-main">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.6 16.6c-.7-.7-1.1-1.7-1.1-4.2A6.5 6.5 0 0 1 12 5.9a6.5 6.5 0 0 1 6.5 6.5c0 2.5-.4 3.5-1.1 4.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M12 5.9V4.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M10.4 19.1a1.8 1.8 0 0 0 3.2 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span data-i18n="notifications">Notifications</span>
        </span>
        <span class="chev" id="notify-state">off</span>
      </button>
      <button class="menu-row" id="btn-install" hidden>
        <span class="menu-row-main">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 4.4v9.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M8.2 10.4 12 14.2l3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.6 18.4h12.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span data-i18n="install">Install app</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row danger" id="btn-reset">
        <span class="menu-row-main">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M19.6 12a7.6 7.6 0 1 1-2.2-5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M19.8 5.6V10h-4.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="restart">Restart</span>
        </span>
        <span class="chev">›</span>
      </button>
    </nav>
  </div>
  <div id="scrim" hidden></div>

  <script type="module" src="/src/main.ts"></script>
  <noscript><div class="noscript">This game runs on JavaScript and WebAssembly — please enable JavaScript.</div></noscript>
</body>
</html>

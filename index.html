<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tamagotchi</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b1e33" />
  <link rel="stylesheet" href="/src/ui/device.css" />
</head>
<body>
  <div id="device" class="shell-teal">
    <div class="keychain"><span class="ring"></span><span class="chain"></span></div>
    <div class="screen-frame">
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="50.0,0.0 57.1,9.6 67.1,3.0 70.5,14.5 82.1,11.7 81.4,23.6 93.3,25.0 88.5,36.0 99.2,41.3 91.0,50.0 99.2,58.7 88.5,64.0 93.3,75.0 81.4,76.4 82.1,88.3 70.5,85.5 67.1,97.0 57.1,90.4 50.0,100.0 42.9,90.4 32.9,97.0 29.5,85.5 17.9,88.3 18.6,76.4 6.7,75.0 11.5,64.0 0.8,58.7 9.0,50.0 0.8,41.3 11.5,36.0 6.7,25.0 18.6,23.6 17.9,11.7 29.5,14.5 32.9,3.0 42.9,9.6" />
      </svg>
      <div class="screen-well">
        <canvas id="lcd" width="32" height="16"></canvas>
      </div>
    </div>
    <div id="controls">
      <div class="ctrl"><button id="btn-a" aria-label="Select"></button><span>SELECT</span></div>
      <div class="ctrl"><button id="btn-b" aria-label="Confirm"></button><span>CONFIRM</span></div>
      <div class="ctrl"><button id="btn-c" aria-label="Next"></button><span>NEXT</span></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    if ("serviceWorker" in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("/sw.js").then((r) => r.update()).catch(() => {});
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        // Nur bei einem echten Update neu laden (nicht beim Erst-Install).
        if (hadController && !refreshing) { refreshing = true; location.reload(); }
      });
    }
  </script>
</body>
</html>

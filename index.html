<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tamagotchi P1 — Play the original 1996 firmware in your browser</title>
  <meta name="description" content="Play the original Tamagotchi P1 (1996) firmware right in your browser. Feed, play with and raise your virtual pet — your progress is saved automatically. Free, no account, works offline." />
  <meta name="theme-color" content="#0a1a2e" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="https://tamagotchi.fugjoo.com/" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tamagotchi P1" />
  <meta property="og:title" content="Tamagotchi P1 — the original firmware, in your browser" />
  <meta property="og:description" content="Play the original 1996 Tamagotchi P1 firmware in your browser. Feed, play and raise your pet. Progress saves automatically." />
  <meta property="og:url" content="https://tamagotchi.fugjoo.com/" />
  <meta property="og:image" content="https://tamagotchi.fugjoo.com/icons/icon-512.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Tamagotchi P1 — the original firmware, in your browser" />
  <meta name="twitter:description" content="Play the original 1996 Tamagotchi P1 firmware in your browser." />
  <meta name="twitter:image" content="https://tamagotchi.fugjoo.com/icons/icon-512.png" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/src/ui/device.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tamagotchi P1",
    "url": "https://tamagotchi.fugjoo.com/",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web",
    "browserRequirements": "Requires JavaScript and WebAssembly",
    "description": "Play the original Tamagotchi P1 (1996) firmware in your browser. Feed, play and raise your virtual pet; progress saves automatically.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
  }
  </script>
</head>
<body data-bg="day">
  <div class="bg-anim" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="#top">Tamagotchi<span>P1</span></a>
      <button class="hamburger" id="btn-menu" aria-label="Menu" aria-expanded="false" aria-controls="menu">☰</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="device-wrap">
      <div class="hanger" aria-hidden="true"><span class="chain"></span><span class="ring"></span></div>
      <div id="device" class="shell-teal">
        <div class="screen-wrap">
          <svg class="star" viewBox="0 0 100 100" aria-hidden="true" preserveAspectRatio="none">
            <defs>
              <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffe45c" />
                <stop offset="0.5" stop-color="#ffd21e" />
                <stop offset="1" stop-color="#f0b400" />
              </linearGradient>
            </defs>
            <polygon points="50.0,0.0 57.1,9.6 67.1,3.0 70.5,14.5 82.1,11.7 81.4,23.6 93.3,25.0 88.5,36.0 99.2,41.3 91.0,50.0 99.2,58.7 88.5,64.0 93.3,75.0 81.4,76.4 82.1,88.3 70.5,85.5 67.1,97.0 57.1,90.4 50.0,100.0 42.9,90.4 32.9,97.0 29.5,85.5 17.9,88.3 18.6,76.4 6.7,75.0 11.5,64.0 0.8,58.7 9.0,50.0 0.8,41.3 11.5,36.0 6.7,25.0 18.6,23.6 17.9,11.7 29.5,14.5 32.9,3.0 42.9,9.6" fill="url(#sun)" />
          </svg>
          <div class="screen-stack">
            <canvas class="icons" id="icons-top" width="32" height="8"></canvas>
            <div class="screen-well">
              <canvas id="lcd" width="32" height="16"></canvas>
            </div>
            <canvas class="icons" id="icons-bottom" width="32" height="8"></canvas>
          </div>
        </div>
        <div id="controls">
          <div class="ctrl"><button id="btn-a" aria-label="Select"></button><span>SELECT</span></div>
          <div class="ctrl"><button id="btn-b" aria-label="Confirm"></button><span>CONFIRM</span></div>
          <div class="ctrl"><button id="btn-c" aria-label="Next"></button><span>NEXT</span></div>
        </div>
      </div>
      </div>
      <div class="device-shadow" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>For personal use · real P1 firmware via TamaLIB · <span id="year"></span></p>
  </footer>

  <div id="modal" hidden>
    <div class="card">
      <h2>Restart?</h2>
      <p class="hint">Your current progress will be discarded and a new egg begins.</p>
      <div class="row">
        <button id="btn-cancel">Cancel</button>
        <button id="btn-confirm-reset">Restart</button>
      </div>
    </div>
  </div>

  <div id="loading"><div class="spin"></div><div class="loadtxt">loading …</div></div>

  <div class="menu" id="menu" hidden>
    <div class="menu-head"><b>Menu</b><button class="menu-x" id="menu-close" aria-label="Close">✕</button></div>
    <div class="menu-sec">
      <span class="menu-label">Background</span>
      <div class="bgbtns" id="bgbtns"></div>
    </div>
    <div class="menu-divider"></div>
    <nav class="menu-list">
      <button class="menu-row" id="btn-notify">Notifications <span class="chev" id="notify-state">off</span></button>
      <a class="menu-row" href="/guide.html">Guide <span class="chev">›</span></a>
      <button class="menu-row danger" id="btn-reset">Restart <span class="chev">›</span></button>
    </nav>
  </div>
  <div id="scrim" hidden></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    if ("serviceWorker" in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("/sw.js?v=3", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !refreshing) { refreshing = true; location.reload(); }
      });
    }
  </script>
</body>
</html>
